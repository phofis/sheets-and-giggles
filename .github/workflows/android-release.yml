name: Build and Publish Preview APK

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check supabase url
        run: test -n "$EXPO_PUBLIC_SUPABASE_URL" && echo "Supabase URL is set" || echo "Supabase URL is MISSING"
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}

      - name: Check supabase key
        run: test -n "$EXPO_PUBLIC_SUPABASE_KEY" && echo "Supabase KEY is set" || echo "Supabase KEY is MISSING"
        env:
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
        run: npx expo prebuild --platform android --no-install

      - name: Build preview APK
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Create GitHub Release (preview APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-preview-${{ github.run_number }}
          name: Android preview build ${{ github.run_number }}
          body: |
            Preview APK for internal testing (standalone, embedded JS bundle).
            Built from commit ${{ github.sha }}.
          files: android/app/build/outputs/apk/release/app-release.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
